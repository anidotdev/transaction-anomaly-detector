[project]
name = "transaction-anomaly-detector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "pydantic",
    "psycopg[binary]",
]

[project.optional-dependencies]
worker = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "boto3"
]

[tool.fastapi]
entrypoint = "app.main:app"
